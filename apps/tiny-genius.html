<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiny Genius — Smart Learning Coach</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css?v=28" />
  <link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml" sizes="any" />
</head>
<body class="subpage theme-green">
  <div class="float-sprites" aria-hidden="true">
    <span class="sprite" style="--x:10%;--d:16s;--delay:-2s;">🌿</span>
    <span class="sprite" style="--x:30%;--d:20s;--delay:-8s;">🐛</span>
    <span class="sprite" style="--x:55%;--d:18s;--delay:-4s;">🌸</span>
    <span class="sprite" style="--x:80%;--d:22s;--delay:-10s;">🦉</span>
  </div>

  <header class="subpage-top">
    <a href="../index.html" class="back-btn">← Back to Explorer</a>
    <div style="display:inline-flex; gap:10px; align-items:center;">
      <button type="button" class="star-badge" id="starBadge" title="View quiz rewards" style="display:none;">
        <span class="reward-part stars"><span class="star-ico">⭐</span><span id="starCount">0</span></span>
        <span class="reward-part gifts" id="giftPart" style="display:none;"><span class="gift-ico">🎁</span><span id="giftCount">0</span></span>
      </button>
      <button type="button" class="star-badge household-badge" id="householdBadge" title="View household rewards" style="display:none;">
        <span class="reward-part hh-stars"><span class="hh-ico" id="householdStarIco">★</span><span id="householdStarCount">0</span></span>
        <span class="reward-part hh-gifts" id="householdGiftPart"><span class="gift-ico">🎁</span><span id="householdGiftCount">0</span></span>
      </button>
      <button type="button" class="star-badge money-badge" id="moneyBadge" title="Pocket money earned" style="display:none;">
        <span class="reward-part money"><span class="money-ico">💵</span><span id="moneyCount">$0.00</span></span>
      </button>
      <div class="profile-menu" id="profileMenu" style="display:none;">
        <button type="button" class="user-chip profile-trigger subpage-chip" id="userChip" aria-haspopup="true" aria-expanded="false">
          <span class="avatar" id="userAvatar">🙂</span>
          <span class="who">
            <span id="userName">Explorer</span>
            <small id="userMeta">Age —</small>
          </span>
          <span class="user-chip-caret" aria-hidden="true">▼</span>
        </button>
        <div class="profile-dropdown" id="profileDropdown">
          <button type="button" id="themeMenuBtn">🎨 Themes</button>
          <button type="button" id="approvalMenuBtn">🔐 Create Approval Code</button>
          <button type="button" id="remindCodeBtn">📧 Remind Me My Code</button>
          <button type="button" class="pd-signout" id="signoutBtn">Sign out</button>
          <button type="button" class="pd-delete" id="deleteAccountBtn">Delete Account</button>
        </div>
      </div>
    </div>
  </header>

  <section class="sub-hero">
    <div style="font-size:64px;">🦉</div>
    <h1>Tiny Genius</h1>
    <p>Your gentle, nature-loving smart coach! Pick an activity below and let's learn together. 🌱</p>
  </section>

  <section class="tiles">
    <button class="tile" data-tile="water">
      <span class="tile-icon">💧</span>
      <div class="tile-title">Water Reminder</div>
      <div class="tile-sub">Sip a glass every hour</div>
    </button>
    <button class="tile" data-tile="bedtime">
      <span class="tile-icon">🌙</span>
      <div class="tile-title">Bedtime Mode</div>
      <div class="tile-sub">Soft story time</div>
    </button>
    <button class="tile" data-tile="rewards">
      <span class="tile-icon">🏆</span>
      <div class="tile-title">My Rewards</div>
      <div class="tile-sub">Stars & badges</div>
    </button>
    <button class="tile" data-tile="mindful">
      <span class="tile-icon">🧘</span>
      <div class="tile-title">Breathe &amp; Relax</div>
      <div class="tile-sub">1-minute calm</div>
    </button>
  </section>

  <div class="modal-backdrop" id="modal">
    <div class="modal tiny-modal">
      <div class="tiny-modal-emoji" id="modal-emoji">✨</div>
      <h3 id="modal-title">Hi!</h3>
      <p id="modal-body">Something fun goes here.</p>
      <div class="tiny-modal-meta" id="modal-meta"></div>
      <div class="tiny-modal-actions">
        <button class="primary-btn" id="modal-next" style="display:none;">Show me another 🔁</button>
        <button class="close" id="modal-close">Got it! ✨</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js?v=2"></script>
  <script src="../auth.js?v=22"></script>
  <script src="../themes.js?v=1"></script>
  <script src="../approval.js?v=9"></script>
  <script src="../profile-menu.js?v=1"></script>
  <script src="../mystery-box.js?v=12"></script>
  <script src="tiny-bank.js?v=4"></script>
  <script>
    const _user = LEW.requireAuth({ loginUrl: '../login.html' });
    if (_user) {
      LEW.wireProfileMenu(_user);
      if (typeof LEW.refreshRewardBadge === 'function') LEW.refreshRewardBadge();
    }
  </script>
  <script src="../script.js?v=3"></script>
  <script>
    const modal = document.getElementById('modal');
    const mtitle = document.getElementById('modal-title');
    const mbody = document.getElementById('modal-body');
    const memoji = document.getElementById('modal-emoji');
    const mmeta = document.getElementById('modal-meta');
    const mnext = document.getElementById('modal-next');
    document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('open'));

    const TB = window.LEW && window.LEW.TinyBank;
    const POOL = TB ? TB.POOL_SIZE : 5000;

    const TOPIC_LABEL = {
      water:   'Water Reminder',
      bedtime: 'Bedtime Mode',
      mindful: 'Breathe & Relax'
    };

    let currentTopic = null;

    function showItem(topic) {
      currentTopic = topic;
      if (!TB) return;
      const item = TB.pick(topic);
      if (!item) return;
      memoji.textContent = item.e || '✨';
      mtitle.textContent = item.t || 'Tiny tip';
      mbody.textContent = item.b || '';
      const seen = TB.totalSeen(topic);
      mmeta.textContent = `${TOPIC_LABEL[topic]} · ${seen.toLocaleString()}/${POOL.toLocaleString()} discovered`;
      mnext.style.display = '';
      modal.classList.add('open');
    }

    function showRewards() {
      currentTopic = null;
      const stars = (LEW.getStars && LEW.getStars()) || 0;
      const gifts = (LEW.getGifts && LEW.getGifts()) || [];
      const hhStars = (LEW.getHouseholdStars && LEW.getHouseholdStars()) || 0;
      const hhStyle = (LEW.getHouseholdStarStyle && LEW.getHouseholdStarStyle()) || null;
      const hhLabel = hhStyle ? hhStyle.label.toLowerCase() : 'household star';
      memoji.textContent = '🏆';
      mtitle.textContent = 'Your Rewards';
      const parts = [];
      if (stars) parts.push(`${stars} ⭐ ${stars === 1 ? 'star' : 'stars'}`);
      if (hhStars) parts.push(`${hhStars} ${hhLabel}${hhStars === 1 ? '' : 's'}`);
      if (gifts.length) parts.push(`${gifts.length} 🎁 ${gifts.length === 1 ? 'gift' : 'gifts'}`);
      if (parts.length === 0) {
        mbody.textContent = "No rewards yet — but every explorer starts somewhere! Try BrainQuest, World Wonders, or Make Pocket Money to earn your first star.";
      } else {
        mbody.innerHTML = `You have <b>${parts.join('</b>, <b>')}</b>. Keep going — the next reward is coming!`;
      }
      mmeta.textContent = '';
      mnext.style.display = 'none';
      modal.classList.add('open');
    }

    mnext.addEventListener('click', () => { if (currentTopic) showItem(currentTopic); });

    document.querySelectorAll('.tile').forEach(t => {
      t.addEventListener('click', () => {
        const k = t.dataset.tile;
        if (k === 'rewards') showRewards();
        else showItem(k);
      });
    });
  </script>
</body>
</html>
